name: Odyssey seat watcher

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install requests
        run: pip install requests

      - name: Run the watcher
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python watcher.py

      - name: Remember what we saw this run
        run: |
          git config user.name "odyssey-watcher"
          git config user.email "actions@github.com"
          git add odyssey_state.json || true
          git diff --staged --quiet || git commit -m "update state"
          git push || true
